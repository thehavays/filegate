name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in FileGate.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Run 'filegate ...'
        2. Execute '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, FileGate version (e.g. Ubuntu 22.04, Python 3.10, FileGate 1.1.10).
    validations:
      required: false
